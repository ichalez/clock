server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Disable all caching
    add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
    
    # Serve files directly - no try_files tricks
    location / {
        # Just serve files as-is
    }
}
