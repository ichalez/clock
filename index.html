<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description"
        content="Reloj mundial elegante mostrando la hora actual en Madrid, San Francisco y Sídney con un diseño moderno y animaciones fluidas">
    <title>World Clock - Madrid, San Francisco & Sydney</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="container">
        <header>
            <h1 class="main-title">World Clock</h1>
            <p class="subtitle">Time Around the Globe</p>
        </header>

        <div class="clocks-grid">
            <!-- Madrid Clock -->
            <div class="clock-card" data-timezone="Europe/Madrid">
                <div class="clock-header">
                    <h2 class="city-name">Madrid</h2>
                    <span class="timezone-label">CET/CEST</span>
                </div>
                <div class="analog-clock">
                    <div class="clock-face">
                        <div class="clock-center"></div>
                        <div class="hand hour-hand" id="madrid-hour"></div>
                        <div class="hand minute-hand" id="madrid-minute"></div>
                        <div class="hand second-hand" id="madrid-second"></div>
                        <!-- Clock markers -->
                        <div class="marker marker-12"></div>
                        <div class="marker marker-3"></div>
                        <div class="marker marker-6"></div>
                        <div class="marker marker-9"></div>
                    </div>
                </div>
                <div class="digital-time" id="madrid-digital">00:00:00</div>
                <div class="date-display" id="madrid-date">Loading...</div>
            </div>

            <!-- San Francisco Clock -->
            <div class="clock-card" data-timezone="America/Los_Angeles">
                <div class="clock-header">
                    <h2 class="city-name">San Francisco</h2>
                    <span class="timezone-label">PST/PDT</span>
                </div>
                <div class="analog-clock">
                    <div class="clock-face">
                        <div class="clock-center"></div>
                        <div class="hand hour-hand" id="sf-hour"></div>
                        <div class="hand minute-hand" id="sf-minute"></div>
                        <div class="hand second-hand" id="sf-second"></div>
                        <!-- Clock markers -->
                        <div class="marker marker-12"></div>
                        <div class="marker marker-3"></div>
                        <div class="marker marker-6"></div>
                        <div class="marker marker-9"></div>
                    </div>
                </div>
                <div class="digital-time" id="sf-digital">00:00:00</div>
                <div class="date-display" id="sf-date">Loading...</div>
            </div>

            <!-- Sydney Clock -->
            <div class="clock-card" data-timezone="Australia/Sydney">
                <div class="clock-header">
                    <h2 class="city-name">Sydney</h2>
                    <span class="timezone-label">AEST/AEDT</span>
                </div>
                <div class="analog-clock">
                    <div class="clock-face">
                        <div class="clock-center"></div>
                        <div class="hand hour-hand" id="sydney-hour"></div>
                        <div class="hand minute-hand" id="sydney-minute"></div>
                        <div class="hand second-hand" id="sydney-second"></div>
                        <!-- Clock markers -->
                        <div class="marker marker-12"></div>
                        <div class="marker marker-3"></div>
                        <div class="marker marker-6"></div>
                        <div class="marker marker-9"></div>
                    </div>
                </div>
                <div class="digital-time" id="sydney-digital">00:00:00</div>
                <div class="date-display" id="sydney-date">Loading...</div>
            </div>
        </div>

        <footer>
            <p class="footer-text">Powered by JavaScript • Real-time updates</p>
        </footer>
    </div>

    <script src="script.js"></script>
</body>

</html>
